openapi: 3.0.3
info:
  title: Chronicle Comments API
  description: |-
    API endpoints for managing comments on chronicle entries in Tipsligan 2026.

    **Authentication**: All endpoints require Bearer token in Authorization header.

    **Comment Permissions**:
    - Any authenticated user can post comments
    - Only comment author or admin can edit comments
  version: 1.0.0
  contact:
    name: Tipsligan 2026 Development Team

servers:
  - url: http://localhost:52259/api
    description: Local development server

tags:
  - name: Comments
    description: Chronicle comment operations

paths:
  /chronicle/{chronicleId}/comments:
    get:
      tags:
        - Comments
      summary: Get comments for a chronicle entry
      description: |-
        Retrieve comments for a specific chronicle entry with pagination support.
        Comments are returned in chronological order (oldest first).
      operationId: getCommentsByChronicleId
      security:
        - BearerAuth: []
      parameters:
        - name: chronicleId
          in: path
          required: true
          description: Chronicle entry ID
          schema:
            type: integer
            format: int32
            example: 1
        - name: skip
          in: query
          required: false
          description: Number of comments to skip (for pagination)
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
            example: 0
        - name: take
          in: query
          required: false
          description: Number of comments to retrieve (page size)
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        "200":
          description: Successfully retrieved comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChronicleCommentsResponse"
              example:
                comments:
                  - id: 1
                    text: "Great news! Looking forward to the new season."
                    authorId: 10
                    authorAlias: "User123"
                    chronicleEntryId: 1
                    createdDate: "2026-02-19T15:00:00Z"
                  - id: 2
                    text: "When does the first round start?"
                    authorId: 11
                    authorAlias: "BetMaster"
                    chronicleEntryId: 1
                    createdDate: "2026-02-19T15:30:00Z"
                  - id: 3
                    text: "First round starts March 1st (corrected)"
                    authorId: 11
                    authorAlias: "BetMaster"
                    chronicleEntryId: 1
                    createdDate: "2026-02-19T15:32:00Z"
                    lastEditedDate: "2026-02-19T15:35:00Z"
                    editedById: 11
                    editedByAlias: "BetMaster"
                totalCount: 3
                hasMore: false
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/ChronicleNotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Comments
      summary: Create new comment
      description: |-
        Post a new comment on a chronicle entry. Available to all authenticated users.
        Comment text is limited to 500 characters (plain text only).
      operationId: createComment
      security:
        - BearerAuth: []
      parameters:
        - name: chronicleId
          in: path
          required: true
          description: Chronicle entry ID to comment on
          schema:
            type: integer
            format: int32
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
            example:
              text: "This is very helpful information, thank you!"
      responses:
        "201":
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChronicleComment"
              example:
                id: 4
                text: "This is very helpful information, thank you!"
                authorId: 12
                authorAlias: "NewUser"
                chronicleEntryId: 1
                createdDate: "2026-02-19T16:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/ChronicleNotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /chronicle/{chronicleId}/comments/{commentId}:
    put:
      tags:
        - Comments
      summary: Update comment (author or admin only)
      description: |-
        Update an existing comment. Only the comment author or an admin can edit.
        Sets LastEditedDate and EditedById. If edited by admin (different from author), EditedByAlias shows admin attribution.
      operationId: updateComment
      security:
        - BearerAuth: []
      parameters:
        - name: chronicleId
          in: path
          required: true
          description: Chronicle entry ID
          schema:
            type: integer
            format: int32
            example: 1
        - name: commentId
          in: path
          required: true
          description: Comment ID to update
          schema:
            type: integer
            format: int32
            example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
            example:
              text: "First round starts March 1st 2026 (corrected by admin)"
      responses:
        "200":
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChronicleComment"
              example:
                id: 3
                text: "First round starts March 1st 2026 (corrected by admin)"
                authorId: 11
                authorAlias: "BetMaster"
                chronicleEntryId: 1
                createdDate: "2026-02-19T15:32:00Z"
                lastEditedDate: "2026-02-19T17:00:00Z"
                editedById: 5
                editedByAlias: "AdminUser"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/CommentNotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/login endpoint

  schemas:
    ChronicleComment:
      type: object
      required:
        - id
        - text
        - authorId
        - authorAlias
        - chronicleEntryId
        - createdDate
      properties:
        id:
          type: integer
          format: int32
          description: Unique comment identifier
          example: 1
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Comment content (plain text, no HTML)
          example: "Great news! Looking forward to the new season."
        authorId:
          type: integer
          format: int32
          description: User ID of the commenter
          example: 10
        authorAlias:
          type: string
          description: Display name of the commenter
          example: "User123"
        chronicleEntryId:
          type: integer
          format: int32
          description: Parent chronicle entry ID
          example: 1
        createdDate:
          type: string
          format: date-time
          description: ISO 8601 timestamp of creation
          example: "2026-02-19T15:00:00Z"
        lastEditedDate:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp of last edit (null if never edited)
          example: "2026-02-19T17:00:00Z"
        editedById:
          type: integer
          format: int32
          nullable: true
          description: User ID of last editor (null if never edited, could be author or admin)
          example: 5
        editedByAlias:
          type: string
          nullable: true
          description: Display name of last editor (shows admin attribution if different from author)
          example: "AdminUser"

    CreateCommentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Comment content (plain text, HTML will be stripped)
          example: "This is very helpful information, thank you!"

    UpdateCommentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Updated comment content (plain text, HTML will be stripped)
          example: "This is very helpful information, thanks! (edited)"

    ChronicleCommentsResponse:
      type: object
      required:
        - comments
        - totalCount
        - hasMore
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/ChronicleComment"
          description: Array of comments (sorted chronologically, oldest first)
        totalCount:
          type: integer
          format: int32
          description: Total number of comments for this chronicle entry
          example: 15
        hasMore:
          type: boolean
          description: Whether there are more comments to load (for pagination)
          example: true

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message
          example: "Validation failed"
        details:
          type: string
          description: Additional error details
          example: "Comment text must be between 1 and 500 characters"

  responses:
    BadRequestError:
      description: Invalid request (validation failed)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            emptyText:
              summary: Empty comment text
              value:
                message: "Validation failed"
                details: "Comment text must not be empty"
            tooLong:
              summary: Comment text too long
              value:
                message: "Validation failed"
                details: "Comment text must be 500 characters or less"

    UnauthorizedError:
      description: Authentication required (missing or invalid token)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "Authorization header missing or invalid"

    ForbiddenError:
      description: Insufficient permissions (only comment author or admin can edit)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "You do not have permission to edit this comment"

    ChronicleNotFoundError:
      description: Chronicle entry not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "Chronicle entry with ID 999 not found"

    CommentNotFoundError:
      description: Comment not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "Comment with ID 999 not found"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "An unexpected error occurred"
